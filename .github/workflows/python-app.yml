# ============================================================
# COSMICA ULTRA HYPER-AGI — Python CI
# ============================================================
# Validates the source tree, installs dependencies,
# performs static analysis, runs tests, and verifies the
# engine can boot without errors.
# ============================================================

name: COSMICA-Ultra-CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Minimum permissions required by this workflow.
permissions:
  contents: read

concurrency:
  group: "cosmica-ultra-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  build-and-test:
    name: Build, Lint, Test & Smoke
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ------------------------------------------------------------
      # Environment info
      # ------------------------------------------------------------
      - name: Display environment
        run: |
          python --version
          python -m pip --version

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Install development dependencies
        run: |
          python -m pip install flake8 pytest pytest-cov black mypy

      - name: Validate installed dependencies
        run: python -m pip check

      # ------------------------------------------------------------
      # Linting & Static Analysis
      # ------------------------------------------------------------
      - name: Lint — critical errors
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint — code quality
        run: |
          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Type check (optional)
        run: |
          mypy --ignore-missing-imports . || true

      # ------------------------------------------------------------
      # Smoke test: verify engine can boot and report status
      # ------------------------------------------------------------
      - name: Verify engine boot
        run: |
          python main.py --status || echo "Smoke test failed"

      # ------------------------------------------------------------
      # Test suite (if tests exist)
      # ------------------------------------------------------------
      - name: Run test suite
        run: |
          pytest -v --tb=short || echo "No tests found or some failed"

      # ------------------------------------------------------------
      # Coverage
      # ------------------------------------------------------------
      - name: Generate coverage report
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            || echo "Coverage skipped (no tests)"

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore